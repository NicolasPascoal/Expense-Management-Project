name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expense_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: expense_management_test
      JWT_SECRET_KEY: chave-de-teste-ci-nao-usar-em-producao
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # mesma versão do back/Dockerfile
          cache: pip
          cache-dependency-path: back/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt ruff==0.16.1

      - name: Lint (ruff)
        run: ruff check app

      - name: Migrations (mesmo caminho do deploy, 2x para provar idempotência)
        run: python migrar_banco.py && python migrar_banco.py

      - name: Testes (pytest)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Build
        run: npm run build

  # Configuração de produção (docs/Deploy.md): compose e Caddyfile válidos, e o
  # serviço de backup gera um dump que de fato restaura (mesmos comandos da
  # seção 9.1 do Deploy.md). Não sobe o Caddy: sem DNS real não há certificado.
  producao:
    runs-on: ubuntu-latest
    env:
      DOMINIO: gabaro.exemplo.com.br
      PGPASSWORD: senha-de-teste-ci
      JWT_SECRET_KEY: chave-de-teste-ci-nao-usar-em-producao
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: senha-de-teste-ci
    steps:
      - uses: actions/checkout@v4

      - name: Validar docker-compose.yml
        run: docker compose config --quiet

      - name: Validar Caddyfile
        run: >-
          docker run --rm -e DOMINIO
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Subir banco e backend (cria o schema)
        run: |
          docker compose up -d --build db_postgres backend
          for i in $(seq 1 60); do docker compose logs backend | grep -q "Booting worker" && break; sleep 2; done
          docker compose logs backend | grep -q "Booting worker"

      - name: Backup gera dump e o dump restaura
        run: |
          docker compose up -d --build backup
          for i in $(seq 1 30); do docker compose logs backup | grep -q "backup local:" && break; sleep 2; done
          docker compose logs backup
          ARQ=$(ls -t backups/*.dump | head -1)
          docker compose exec -T db_postgres createdb -U postgres teste_restauracao
          docker compose exec -T db_postgres pg_restore --no-owner -U postgres -d teste_restauracao < "$ARQ"
          USUARIOS=$(docker compose exec -T db_postgres psql -tA -U postgres -d teste_restauracao -c "select count(*) from usuarios")
          echo "usuários no backup restaurado: $USUARIOS"
          test "$USUARIOS" -ge 1

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs

  deploy-staging:
    runs-on: [self-hosted, umbrel]
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Disparar redeploy do stack de dev/staging no Portainer
        run: curl -fsS --max-time 30 -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
